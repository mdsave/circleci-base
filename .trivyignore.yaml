# Accepted findings in third-party binaries that ship their Go dependencies
# statically linked. There is no package to upgrade: verified 2026-08-17 that
# apt reports Candidate == Installed for docker-ce-cli, docker-buildx-plugin
# and docker-compose-plugin, and yq is fetched from releases/latest. Fixes
# require the vendor to recompile and publish.
#
# These are suppressed so that NEW vendor findings stand out. To see everything
# including these, run 'make trivy-unfixed' (it bypasses this file).
#
# On expiry: rebuild, re-run 'make trivy-unfixed', and drop any entry whose
# upstream has shipped a fix.

