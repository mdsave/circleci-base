# Generated by /tune-coderabbit (tendo-eng-review) - see
# docs/code-review/FEAT-1901/tune-coderabbit-scope.md in tendo-claude-plugins.
# Hand edits are fine; this marker just lets --refresh know it can propose
# changes here instead of treating the file as someone else's hand-authored config.
#
# Bootstrap mode: this repo ships no CLAUDE.md, no AGENTS.md, no docs/ and no
# README on `master`, so nothing here was mined from documented conventions.
# The two per-repo rules below are grounded in the Dockerfile itself, read
# directly - see REVIEW.md for what was read and why.
#
# What this repo actually is: the CI base image for the MDsave estate. It ships
# a Dockerfile plus a local dev entry point, and - the part that matters for
# review - NO CI config, NO test suite and NO build script, so the only
# verification a change here gets is that the image builds.
# That, plus the blast radius (every repo's CI executes from this image), is why
# the Dockerfile rule below is worth more than a stack of generic lint rules.

language: 'en-US'
early_access: false

reviews:
  profile: 'chill'
  request_changes_workflow: false   # calibration decision, per-repo - see REVIEW.md
  review_details: true              # surfaces chill-suppressed comments during calibration
  high_level_summary: true
  changed_files_summary: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  pre_merge_checks:
    docstrings:
      mode: 'off'                   # a Dockerfile and one shell script; nothing to docstring
    title:
      mode: 'warning'
    description:
      mode: 'warning'
    issue_assessment:
      mode: 'warning'
  path_instructions:
    # --- Org-wide, non-negotiable (from coderabbit-baseline.yaml) ---
    # These are the only way the two protections set org-wide via CodeRabbit
    # Organization Settings survive once a repo has its own yaml (`inheritance`
    # confirmed to have zero effect). Never remove or let per-repo mining
    # override them.
    - path: '**/*'
      instructions: |
        PHI/PII audit logging: flag any code that logs, prints, or persists
        patient-identifying info - including but not limited to name, DOB,
        MRN, SSN, insurance/member ID, email address, phone number, or
        physical address - without an approved audit-logging wrapper or
        de-identification step. This list is illustrative, not exhaustive:
        any information that could identify a specific patient is in scope.
    - path: '**/*'
      instructions: |
        Secrets/credentials: flag any hardcoded credential, API key, token,
        or password - including test fixtures, config files, and comments -
        reinforcing (not replacing) the automated gitleaks scan.

    # --- Per-repo, grounded in the Dockerfile as it stands today ---

    - path: 'Dockerfile'
      instructions: |
        This image is the CI base for the whole MDsave estate - every repo's CI
        jobs execute inside it - so a change here propagates everywhere at once
        and there is no test suite in this repo to catch a regression. Review it
        as a supply-chain change, not a config tweak.

        Flag, with reasons:
        - A package installed without a version pin where the install is
          load-bearing. `docker-ce` is currently unpinned, so the image's Docker
          version changes silently with whatever the upstream repo serves on
          rebuild day.
        - `apt-key add` for a new key. It is deprecated and adds the key to the
          global trusted set, so that key can then sign ANY package from ANY
          configured repo. New keys belong in /etc/apt/keyrings with a
          `signed-by=` on the corresponding sources entry.
        - A new `wget`/`curl` fetch of an executable with no checksum and no
          pinned version - the existing `docker-compose` fetch pins 1.11.2,
          which is the pattern to keep (pinned), not the version to copy.
        - A trailing space after a line-continuation backslash. There is one
          today at line 25 (`libffi-dev \ `); it makes the continuation an
          empty line rather than a join, and the failure is silent.
        - A base-image bump. The current base is EOL (Ubuntu 14.04), so a bump
          is desirable, but it is a breaking change for every downstream CI job
          and must be called out in the PR description rather than slipped in.

    - path: '{dev/init,Vagrantfile}'
      instructions: |
        These are the local development entry points for the image, and they
        are the only executable code here besides the Dockerfile. Nothing in
        this repo runs them in CI, so a mistake surfaces only when someone next
        builds locally. Flag unquoted variable expansions, missing error
        handling on a command whose failure should stop the script, and any
        divergence from what the Dockerfile actually installs - the two drifting
        apart is the failure mode that wastes an afternoon.

  auto_review:
    enabled: true
    auto_incremental_review: true
  tools:
    gitleaks:
      enabled: true                 # never suppressed by chill profile; keep explicit anyway
    hadolint:
      enabled: true                 # the Dockerfile IS this repo; it needs no repo config to be
                                    # meaningful, so its presence is the evidence (stack-tool-map.md)
    # No `circleci` and no `actionlint`: despite the repo's name, `master` carries
    # NO .circleci/config.yml, and .github holds only CODEOWNERS - no workflows.
    # Enabling either would be reviewing a tool this repo does not run.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: 'auto'
    approval_delay: 7
  jira:
    usage: 'enabled'
    project_keys: []                # deliberately empty: exactly ONE MDS-NNNN reference exists
                                    # across every branch, PR and commit in this repo
                                    # (MDS-20319-upgrade-aptible-cli), which is below the
                                    # >=2-occurrence threshold. Add 'MDS' once a second real
                                    # reference appears - do not pre-populate it on the grounds
                                    # that MDS is the org's usual key.

# No `path_filters`. There is nothing generated, vendored or compiled in this
# repo, and `.gitignore` covers only `.vagrant`, which is never committed. A
# speculative exclusion would only risk disabling secret scanning on a path
# that does not exist.
