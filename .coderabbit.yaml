# Generated by /tune-coderabbit (tendo-eng-review) - see
# docs/code-review/FEAT-1901/tune-coderabbit-scope.md in tendo-claude-plugins.
# Hand edits are fine; this marker just lets --refresh know it can propose
# changes here instead of treating the file as someone else's hand-authored config.
#
# Bootstrap mode: this repo ships no CLAUDE.md, no AGENTS.md and no docs/, so
# nothing here was mined from documented conventions. Every per-repo rule below
# is grounded in the Dockerfile and .circleci/ scripts, read directly against
# the tree this branch is merged with - see REVIEW.md for the evidence.
#
# What this repo is: the CI base image the whole MDsave estate executes from.
# A change here propagates to every repo's CI at once, and there is no test
# suite - the only verification a change gets is that the image builds and
# pushes. That blast radius is why the rules below are weighted toward supply
# chain (pinning, provenance, checksums) rather than style.

language: 'en-US'
early_access: false

reviews:
  profile: 'chill'
  request_changes_workflow: false   # calibration decision, per-repo - see REVIEW.md
  review_details: true              # surfaces chill-suppressed comments during calibration
  high_level_summary: true
  changed_files_summary: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  pre_merge_checks:
    docstrings:
      mode: 'off'                   # a Dockerfile and four shell scripts; nothing to docstring
    title:
      mode: 'warning'
    description:
      mode: 'warning'
    issue_assessment:
      mode: 'warning'
  path_instructions:
    # --- Org-wide, non-negotiable (from coderabbit-baseline.yaml) ---
    # These are the only way the two protections set org-wide via CodeRabbit
    # Organization Settings survive once a repo has its own yaml (`inheritance`
    # confirmed to have zero effect). Never remove or let per-repo mining
    # override them.
    - path: '**/*'
      instructions: |
        PHI/PII audit logging: flag any code that logs, prints, or persists
        patient-identifying info - including but not limited to name, DOB,
        MRN, SSN, insurance/member ID, email address, phone number, or
        physical address - without an approved audit-logging wrapper or
        de-identification step. This list is illustrative, not exhaustive:
        any information that could identify a specific patient is in scope.
    - path: '**/*'
      instructions: |
        Secrets/credentials: flag any hardcoded credential, API key, token,
        or password - including test fixtures, config files, and comments -
        reinforcing (not replacing) the automated gitleaks scan.

    # --- Per-repo, grounded in the tree as it stands after the 2.4 merge ---

    - path: 'Dockerfile'
      instructions: |
        Every repo's CI executes inside this image and there is no test suite
        here, so review this as a supply-chain change rather than a config
        tweak.

        Flag, with reasons:
        - A fetched artifact resolved at BUILD TIME rather than pinned. Three
          are live today and drift on every rebuild: the aptible-toolbelt deb
          (its URL contains `latest`), `yq` (from
          `releases/latest/download/`), and the AWS CLI v2 zip (that URL is
          always current). `jq` shows the shape to prefer - it pins an exact
          release tag. A new unpinned fetch should be justified in the PR, not
          slipped in.
        - A download with no integrity check. NONE of the four fetches above
          verifies a checksum or signature. That is the standing state, so
          raise it when a PR touches one of those lines or adds a fifth - do
          not re-report it on every unrelated diff.
        - `apt-key add` for a new key (live at line 35). It is deprecated and
          adds the key to the GLOBAL trusted set, so that key can then sign
          any package from any configured repo. New keys belong in
          /etc/apt/keyrings with a `signed-by=` on the matching sources entry.
        - An unpinned `apt-get install` of something load-bearing. The Docker
          packages (`docker-ce-cli`, `docker-buildx-plugin`,
          `docker-compose-plugin`) are unpinned today, so the Docker client in
          CI moves with whatever upstream serves on rebuild day.
        - A new single-architecture assumption. `x86_64`/`amd64` is hardcoded
          for the AWS CLI, `yq` and the aptible deb. That is a real constraint
          on where this image can build, and changing it is not a local
          decision.
        - A base-image bump. It is not a chore: it changes the toolchain under
          every downstream CI job and belongs in the PR description as the
          stated purpose.
        - A comment that no longer matches the code beside it. Live example:
          the `# install jq 1.5` comment sits above a fetch of jq 1.8.0.

    - path: '.circleci/**'
      instructions: |
        - `deploy` tags the image with the RAW branch name
          (`docker build -t "$IMAGE:$CIRCLE_BRANCH"`), and the workflow carries
          no branch filter, so every branch that runs CI publishes a tag. A
          Docker tag component cannot contain `/`, so a `type/slug` branch name
          cannot produce a valid tag here. Flag any change that widens what
          runs this job, or that derives a tag from a branch name without
          sanitising it.
        - The `:current` tag is the Aikido scan anchor and is published ONLY
          when `$CIRCLE_BRANCH` equals `$RELEASE_BRANCH` (read from `RELEASE`).
          Flag any change that moves `:current` off that gate - it would point
          the security scan at an arbitrary branch's image.
        - These scripts run with credentials that can push to ECR. Treat an
          added network call, an added `eval`, or a widened IAM assumption as
          a security change, not plumbing.

    - path: '{dev/init,Vagrantfile}'
      instructions: |
        The local development entry points. Nothing in CI exercises them, so a
        mistake surfaces only when someone next builds locally. Flag unquoted
        variable expansions, missing error handling where a failure should stop
        the script, and drift from what the Dockerfile actually installs - the
        two falling out of step is the failure mode that wastes an afternoon.

  auto_review:
    enabled: true
    auto_incremental_review: true
  tools:
    gitleaks:
      enabled: true                 # never suppressed by chill profile; keep explicit anyway
    hadolint:
      enabled: true                 # the Dockerfile is this repo's whole point; needs no repo
                                    # config to be meaningful, so presence is the evidence
    circleci:
      enabled: true                 # .circleci/config.yml arrived on master with the 2.4 merge
    # No `actionlint`: .github holds only CODEOWNERS, no workflows.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: 'auto'
    approval_delay: 7
  jira:
    usage: 'enabled'
    project_keys: []                # deliberately empty: only ONE MDS-NNNN reference exists
                                    # across this repo's branches, PRs and commits, below the
                                    # >=2-occurrence threshold. Add 'MDS' when a second real
                                    # reference appears - not pre-populated on the grounds that
                                    # MDS is the org's usual key.

# No `path_filters`. Nothing here is generated, vendored or compiled, and
# `.gitignore` covers only `.vagrant`, which is never committed. A speculative
# exclusion would only risk disabling secret scanning on a path that does not
# exist.
